<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Báo Giá Việt Nhật</title>
    <!-- Sử dụng Tailwind CSS để giao diện đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Tạo Báo Giá - Việt Nhật</h1>
        
        <!-- Form nhập thông tin báo giá -->
        <form id="quoteForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Tên khách hàng / Công ty</label>
                <input type="text" id="customerName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Nội dung báo giá / Sản phẩm</label>
                <textarea id="quoteDetails" rows="4" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Tổng tiền (VNĐ)</label>
                <input type="number" id="totalAmount" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 font-semibold transition">
                Lưu Báo Giá lên Firestore
            </button>
        </form>

        <!-- Thông báo trạng thái -->
        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- Khởi tạo Firebase và kết nối Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase chính xác của dự án bạn
        const firebaseConfig = {
            apiKey: "AIzaSyCzBAxV0U0NGTioQwt6rplNnSIGJFdAmFk",
            authDomain: "baogiavietnhat.firebaseapp.com",
            projectId: "baogiavietnhat",
            storageBucket: "baogiavietnhat.firebasestorage.app",
            messagingSenderId: "581658807792",
            appId: "1:581658807792:web:e94c9538190703c5c76135",
            measurementId: "G-6MGTKXBB1W"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Xử lý sự kiện submit form để đẩy dữ liệu lên Firestore
        const form = document.getElementById('quoteForm');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const customerName = document.getElementById('customerName').value;
            const quoteDetails = document.getElementById('quoteDetails').value;
            const totalAmount = document.getElementById('totalAmount').value;

            try {
                // Thêm một document mới vào collection tên là "quotes" trên Cloud Firestore
                const docRef = await addDoc(collection(db, "quotes"), {
                    customerName,
                    quoteDetails,
                    totalAmount: Number(totalAmount),
                    createdAt: new Date()
                });
                
                statusMessage.textContent = "Lưu báo giá thành công lên Firestore! Mã ID: " + docRef.id;
                statusMessage.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
            } catch (error) {
                console.error("Lỗi khi lưu dữ liệu: ", error);
                statusMessage.textContent = "Lỗi: " + error.message;
                statusMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
            }
        });
    </script>
</body>
</html>
